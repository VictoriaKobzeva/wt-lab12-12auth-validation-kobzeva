services:
  # Отдельный free-инстанс PostgreSQL создать нельзя (лимит Render — один на
  # аккаунт), поэтому сервис работает в схеме wt_lab12 на существующей БД.
  # DATABASE_URL задаётся в дашборде (Internal Database URL инстанса).
  - type: web
    name: wt-lab12-12auth-validation-kobzeva
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /Login
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SCHEMA
        value: wt_lab12
