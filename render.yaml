databases:
  - name: wt-lab12-db-kobzeva
    databaseName: wt_lab12
    user: wt_lab12_user
    plan: free
    region: frankfurt

services:
  - type: web
    name: wt-lab12-12auth-validation-kobzeva
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wt-lab12-db-kobzeva
          property: connectionString
      - key: DATABASE_SCHEMA
        value: wt_lab12
